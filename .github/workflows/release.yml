name: Build and Release Orch APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Orch.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/release-keystore.jks"

      - name: Decode google-services.json (if provided via Secret)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/app/google-services.json"
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${KEYSTORE_PATH}" \
            -Pandroid.injected.signing.store.password="${STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Prepare Fixed Orch.apk Artifact
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          cp "$APK_SOURCE" "${GITHUB_WORKSPACE}/Orch.apk"

      - name: Upload Orch.apk Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orch
          path: ${{ github.workspace }}/Orch.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Orch.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_Type == 'tag' && github.ref_name || inputs.release_tag }}
          name: "Orch ${{ github.ref_Type == 'tag' && github.ref_name || inputs.release_tag }}"
          files: ${{ github.workspace }}/Orch.apk
          generate_release_notes: true
