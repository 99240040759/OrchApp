name: Release

# Build happens here (99240040759/OrchApp). Only the finished APK is published,
# to sameer786ss/orchapp, as a release asset that is always named Orch.apk:
#   https://github.com/sameer786ss/orchapp/releases/latest/download/Orch.apk
# Release by pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH_REPO: sameer786ss/orchapp

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Restores and saves the Gradle user home, dependency and build caches.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Build signed release APK
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${GOOGLE_SERVICES_JSON_BASE64:?Missing GOOGLE_SERVICES_JSON_BASE64 secret}"
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64 secret}"
          # vMAJOR.MINOR.PATCH -> versionName MAJOR.MINOR.PATCH, versionCode MAJOR*1000000 + MINOR*1000 + PATCH.
          # The app's updater uses the same formula to compare versions.
          IFS=. read -r major minor patch <<< "${GITHUB_REF_NAME#v}"
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE=$(( major * 1000000 + minor * 1000 + patch ))
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" Orch.apk

      - name: Publish Orch.apk to ${{ env.PUBLISH_REPO }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$PUBLISH_REPO" > /dev/null 2>&1; then
            gh release delete "$tag" --repo "$PUBLISH_REPO" --yes --cleanup-tag
          fi
          gh release create "$tag" Orch.apk \
            --repo "$PUBLISH_REPO" \
            --title "Orch $tag" \
            --notes "Build ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}" \
            --latest
